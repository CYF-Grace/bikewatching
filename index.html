<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" />
    <link rel="stylesheet" href="map.css" />
    <script type="module" src="map.js"></script>
</head>

<body>
    <header class="page-header">
        <h1>🚴 Bikewatching</h1>

        <div class="time-control">
            <label for="time-slider">Filter by time</label>
            <input id="time-slider" type="range" min="-1" max="1440" value="-1" disabled />
            <div class="time-readout">
                <time id="selected-time" hidden></time>
                <em id="any-time">(any time)</em>
            </div>
        </div>
    </header>
    <p>Explore Bluebikes traffic and bike lanes in Boston and Cambridge.</p>
    <div id="map"></div>
    <div class="legend" role="group" aria-label="Station traffic flow legend">
        <div style="--departure-ratio: 1">More departures</div>
        <div style="--departure-ratio: 0.5">Balanced</div>
        <div style="--departure-ratio: 0">More arrivals</div>
    </div>
</body>

</html>
